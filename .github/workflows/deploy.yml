name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued deploy wait for the running one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
      # Must match the redirect URI registered in the Spotify dashboard byte-for-byte,
      # trailing slash included.
      VITE_SPOTIFY_REDIRECT_URI: https://enuttall2030-oss.github.io/Song-game-/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail early if the Spotify client ID is missing
        run: |
          if [ -z "$VITE_SPOTIFY_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_SPOTIFY_CLIENT_ID is not set."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
